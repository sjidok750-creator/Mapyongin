<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>처인구 도로구조물 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root{--panel:384px;--sheet:0px;--c0:#d93025;--c1:#e37400;--c2:#1a73e8;--c3:#795548;--c4:#9334e6;--c5:#188038;
  --txt:#202124;--mut:#5f6368;--line:#e8eaed;--blue:#1a73e8;--blue2:#1967d2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color:var(--txt);-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#map{position:fixed;top:0;bottom:0;right:0;left:var(--panel);background:#e5e3df}
#panel{position:fixed;left:0;top:0;bottom:0;width:var(--panel);background:#fff;z-index:1000;
  box-shadow:0 0 14px rgba(0,0,0,.2);display:flex;flex-direction:column}
#grab{display:none;height:22px;flex:none;cursor:grab;touch-action:none}
#grab:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#dadce0;margin:9px auto 0}
.top{padding:12px 12px 4px;border-bottom:1px solid var(--line);flex:none}
.title{font-size:13px;color:var(--mut);margin:0 4px 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.title b{color:var(--txt);font-size:14.5px}
.title a{color:var(--blue2);text-decoration:none;white-space:nowrap;font-size:12.5px}
.search{display:flex;align-items:center;border-radius:24px;box-shadow:0 1px 3px rgba(60,64,67,.35);padding:0 4px 0 16px;height:46px;background:#fff}
.search svg{flex:none;color:var(--mut)}
.search input{flex:1;border:0;outline:0;font-size:16px;background:none;min-width:0;padding:0 10px;color:var(--txt)}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:none;font-size:22px;line-height:1;color:var(--mut);width:38px;height:38px;border-radius:50%;cursor:pointer}
.search button:hover{background:#f1f3f4}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid #dadce0;border-radius:16px;padding:5px 11px;
  font-size:13px;background:#fff;cursor:pointer;color:var(--txt)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip .n{color:var(--mut);font-size:12px}
.chip.on{background:#e8f0fe;border-color:var(--blue);color:var(--blue2)}
.chip.on .n{color:var(--blue2)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);padding:2px 2px 4px}
.seg{display:flex;gap:2px}
.seg button{border:0;background:none;font-size:12.5px;padding:4px 9px;border-radius:12px;color:var(--mut);cursor:pointer}
.seg button.on{background:#e8f0fe;color:var(--blue2);font-weight:700}
#list,#detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:#fff;padding:10px 14px;cursor:pointer;font:inherit;color:inherit}
.row:hover{background:#f8f9fa}
.row.sel{background:#e8f0fe}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-size:15px;font-weight:700}
.rt small{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.is-done .rt b{color:var(--mut);font-weight:600}
.dist{font-size:12.5px;color:var(--blue2);flex:none;font-weight:600}
.empty{padding:28px 18px;color:var(--mut);font-size:14px;text-align:center}
.src{padding:14px 16px 20px;font-size:12px;color:var(--mut);line-height:1.6}
.src a{color:var(--blue2)}
.dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;
  font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);flex:none;line-height:1}
.dot.big{width:34px;height:34px;font-size:15px;margin-top:3px}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.dot.rm{background:#9aa0a6;border-style:dashed}
.dot.done{opacity:.5}
.pin,.clu,.hi,.num{background:none;border:0}
.leaflet-tooltip.lbl{background:none;border:0;box-shadow:none;padding:0 0 0 2px;font-size:12.5px;font-weight:700;color:#202124;
  text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 5px #fff;display:none;white-space:nowrap}
.leaflet-tooltip.lbl:before{display:none}
#map.labels-on .leaflet-tooltip.lbl{display:block}
#map.sat .leaflet-tooltip.lbl{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 0 4px #000}
.clu div{width:34px;height:34px;border-radius:50%;background:rgba(32,33,36,.84);color:#fff;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hi div{width:46px;height:46px;border-radius:50%;border:3px solid var(--blue);background:rgba(26,115,232,.14);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.25);opacity:.25}}
.num div{width:18px;height:18px;border-radius:50%;background:#202124;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.me div{width:18px;height:18px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 1px 4px rgba(0,0,0,.4)}
/* 상세 */
.dh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0}
.dh button{border:0;background:none;font-size:14px;color:var(--blue2);padding:8px 12px;border-radius:18px;cursor:pointer}
.dh button:hover{background:#f1f3f4}
.dt{display:flex;gap:12px;align-items:flex-start;padding:4px 18px 2px}
.dt h2{margin:0;font-size:22px;font-weight:700;word-break:keep-all}
.muted{color:var(--mut);font-size:14px;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px 4px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:12px;background:#f1f3f4;color:#3c4043}
.tag.warn{background:#fce8e6;color:#c5221f}.tag.ok{background:#e6f4ea;color:#137333}
.acts{display:flex;gap:2px;justify-content:space-around;padding:12px 6px 14px;border-bottom:1px solid var(--line)}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--blue2);font-size:12px;
  min-width:62px;background:none;border:0;cursor:pointer;padding:0}
.act .ic{width:42px;height:42px;border-radius:50%;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;background:#fff}
.act.primary .ic{background:var(--blue);border-color:var(--blue);color:#fff}
.act:hover .ic{background:#f1f3f4}.act.primary:hover .ic{background:var(--blue2)}
.info .ln{display:flex;gap:14px;align-items:baseline;padding:10px 18px;font-size:14px;border-bottom:1px solid #f1f3f4}
.info .k{color:var(--mut);width:70px;flex:none;font-size:13px;white-space:nowrap}
.info .v{flex:1;word-break:keep-all;line-height:1.45}
.info .ln button{border:0;background:none;color:var(--blue2);font-size:13px;cursor:pointer;padding:0 2px;flex:none}
.acts2{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 4px}
.btn{border:1px solid #dadce0;background:#fff;border-radius:18px;padding:8px 14px;font-size:13.5px;cursor:pointer;color:var(--blue2)}
.btn:hover{background:#f8f9fa}
.btn.on{background:#e6f4ea;border-color:#81c995;color:#137333}
.fine{font-size:12px;color:var(--mut);padding:6px 18px 0}
/* 지도 위 버튼 */
#fab{position:fixed;right:12px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:900}
#fab button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.32);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:11.5px;font-weight:700}
#fab button.on{color:var(--blue)}
/* 경로 */
#route{position:fixed;top:12px;left:calc(var(--panel) + 12px);z-index:950;background:#fff;border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);padding:10px 12px;width:min(520px, calc(100vw - var(--panel) - 84px))}
#route .rh{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;gap:8px}
#route .rh small{font-weight:400;color:var(--mut);font-size:12px}
#route .rh .btn{flex:none;white-space:nowrap}
#route ol{margin:6px 0 8px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:13px}
#route li{display:inline-flex;align-items:center;gap:4px;background:#f1f3f4;border-radius:12px;padding:2px 4px 2px 8px}
#route li button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:14px;padding:0 3px;line-height:1}
#route .rb{display:flex;gap:6px;flex-wrap:wrap}
#route .rb .btn{padding:6px 11px;font-size:12.5px}
#route .rb .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#323232;color:#fff;font-size:13.5px;padding:10px 16px;
  border-radius:8px;z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.leaflet-container{font-family:inherit}
@media (min-width:761px){.chips{flex-wrap:wrap;overflow:visible}}
@media (max-width:760px){
  #panel.detail .top{display:none}
  #map{left:0}
  #panel{top:auto;width:auto;right:0;height:var(--sheet);border-radius:16px 16px 0 0;transition:height .22s ease;box-shadow:0 -2px 12px rgba(0,0,0,.22)}
  #panel.drag{transition:none}
  #grab{display:block}
  .top{padding-top:2px}
  .title{display:none}
  #fab{bottom:calc(var(--sheet) + 30px);transition:bottom .22s ease}
  .leaflet-bottom{bottom:var(--sheet)}
  #route{left:8px;right:8px;top:8px;width:auto}
  #toast{bottom:calc(var(--sheet) + 16px)}
}
</style>
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <div id="grab" aria-label="목록 크기 바꾸기"></div>
  <div class="top">
    <div class="title"><b id="ttl"></b><a id="srcLink" target="_blank" rel="noopener">네이버 원본 ↗</a></div>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="시설명·번호·주소·노선 검색" autocomplete="off" enterkeyhint="search">
      <button id="qclear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div id="chips" class="chips"></div>
    <div class="bar"><span id="count"></span>
      <span class="seg"><button data-sort="no" class="on">번호순</button><button data-sort="near">가까운 순</button></span></div>
  </div>
  <div id="list"></div>
  <div id="detail" hidden></div>
</aside>
<div id="fab">
  <button id="bMe" title="내 위치" aria-label="내 위치"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button id="bAll" title="전체 보기" aria-label="전체 보기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bLbl" class="on" title="이름표 켜기·끄기">이름</button>
  <button id="bSat" title="위성 사진">위성</button>
</div>
<div id="route" hidden></div>
<div id="toast"></div>

  car: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4ZM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5Z"/></svg>',
  nav: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7Z"/></svg>',
  eye: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
};
function act(label, href, icon, primary, blank) {
  const a = el("a", { class: "act" + (primary ? " primary" : ""), href, target: blank ? "_blank" : null, rel: blank ? "noopener" : null });
  const ic = el("span", { class: "ic" }); ic.innerHTML = icon; a.append(ic, el("span", { text: label })); return a;
}
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = el("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast(what + " 복사했습니다");
}
function renderDetail(r) {
  const L_ = links(r), d = dist(r), inRoute = state.route.includes(r.id), cat = CATS[CI[r.cat]];
  const acts = [act("카카오맵 길찾기", L_.kakao, ICON.car, true, true)];
  if (isPhone) acts.push(act("네이버 길찾기", L_.naver, ICON.car), act("티맵", L_.tmap, ICON.nav));
  acts.push(act("로드뷰", L_.road, ICON.eye, false, true));
  const ln = (k, v, btn) => el("div", { class: "ln" }, el("span", { class: "k", text: k }), el("span", { class: "v", text: v }), btn || null);
  $("#detail").replaceChildren(
    el("div", { class: "dh" }, el("button", { onclick: closeDetail }, "← 목록"), el("button", { onclick: closeDetail, "aria-label": "닫기" }, "✕")),
    el("div", { class: "dt" }, el("span", { class: "dot big c" + CI[r.cat] + (r.removed ? " rm" : ""), text: glyph(r) }),
      el("div", null, el("h2", { text: r.name }), el("div", { class: "muted", text: catLabel(r) + " · " + r.no + "번" + (d != null ? " · " + fmtDist(d) : "") }))),
    el("div", { class: "tags" }, r.road ? el("span", { class: "tag", text: "노선 " + r.road }) : null,
      r.note ? el("span", { class: "tag", text: r.note }) : null,
      r.removed ? el("span", { class: "tag warn", text: "철거" }) : null,
      done[r.id] ? el("span", { class: "tag ok", text: "점검 완료 표시" }) : null),
    el("div", { class: "acts" }, ...acts),
    el("div", { class: "info" },
      ln("주소", r.addr, el("button", { onclick: () => copy(r.addr, "주소를") }, "복사")),
      ln("좌표", r.lat.toFixed(5) + ", " + r.lng.toFixed(5), el("button", { onclick: () => copy(r.lat + ", " + r.lng, "좌표를") }, "복사")),
      ln("네이버 이름", r.label)),
    el("div", { class: "acts2" },
      el("button", { class: "btn" + (inRoute ? " on" : ""), onclick: () => toggleRoute(r.id) }, inRoute ? "✓ 경로에 담김" : "+ 경로에 담기"),
      el("button", { class: "btn" + (done[r.id] ? " on" : ""), onclick: () => toggleDone(r.id) }, done[r.id] ? "✓ 점검 완료" : "점검 완료 표시"),
      el("button", { class: "btn", onclick: () => copy(location.href, "이 시설 링크를") }, "링크 복사")),
    el("p", { class: "fine", text: "점검 완료 표시는 이 기기(브라우저)에만 저장되고 다른 사람과 공유되지 않습니다." }));
}
function toggleDone(id) {
  const r = byId[id]; if (done[id]) delete done[id]; else done[id] = Date.now(); save(DONE_KEY, done);
  markers[id].setIcon(iconFor(r));
  refresh();
  if (state.sel === id) renderDetail(r);
}

/* ---------- 경로 담기 ---------- */
function orderNearest() {
  const pts = state.route.map(id => byId[id]); if (pts.length < 2) return;
  let cur = state.me || pts[0]; const left = state.me ? pts : pts.slice(1), out = state.me ? [] : [pts[0]];
  const dd = (a, b) => (a.lat - b.lat) ** 2 + ((a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180)) ** 2;
  while (left.length) { let bi = 0; left.forEach((p, i) => { if (dd(cur, p) < dd(cur, left[bi])) bi = i; }); cur = left.splice(bi, 1)[0]; out.push(cur); }
  state.route = out.map(r => r.id); save(ROUTE_KEY, state.route); renderRoute();
}
function toggleRoute(id) {
  const i = state.route.indexOf(id);
  if (i >= 0) state.route.splice(i, 1);
  else { if (state.route.length >= MAX_ROUTE) { toast("경로에는 " + MAX_ROUTE + "곳까지 담을 수 있습니다"); return; } state.route.push(id); }
  save(ROUTE_KEY, state.route); renderRoute(); if (state.sel) renderDetail(byId[state.sel]);
}
function routeLinks() {
  const pts = state.route.map(id => byId[id]);
  const seq = (state.me ? [kpt("내 위치", state.me.lat.toFixed(6), state.me.lng.toFixed(6))] : []).concat(pts.map(r => kpt(r.name, r.lat, r.lng)));
  const kakao = seq.length === 1 ? "https://map.kakao.com/link/to/" + seq[0] : "https://map.kakao.com/link/by/car/" + seq.join("/");
  const last = pts[pts.length - 1], p = { dlat: last.lat, dlng: last.lng, dname: last.name };
  pts.slice(0, -1).forEach((r, i) => { p["v" + (i + 1) + "lat"] = r.lat; p["v" + (i + 1) + "lng"] = r.lng; p["v" + (i + 1) + "name"] = r.name; });
  return { kakao, naver: nmap("route/car", p) };
}
function renderRoute() {
  const box = $("#route"); routeLayer.clearLayers();
  if (!state.route.length) { box.hidden = true; return; }
  const pts = state.route.map(id => byId[id]), RL = routeLinks();
  const line = (state.me ? [[state.me.lat, state.me.lng]] : []).concat(pts.map(r => [r.lat, r.lng]));
  if (line.length > 1) L.polyline(line, { color: "#1a73e8", weight: 4, opacity: .75, dashArray: "8 8", interactive: false }).addTo(routeLayer);
  pts.forEach((r, i) => L.marker([r.lat, r.lng], { icon: L.divIcon({ className: "num", html: "<div>" + (i + 1) + "</div>", iconSize: [18, 18], iconAnchor: [-6, 22] }), interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(routeLayer));
  box.hidden = false;
  box.replaceChildren(
    el("div", { class: "rh" }, el("span", null, "경로 " + pts.length + "곳 ", el("small", { text: state.me ? "출발: 내 위치" : "출발: 1번 (내 위치 켜면 현 위치)" })),
      el("button", { class: "btn", style: "padding:3px 9px;font-size:12px", onclick: () => { state.route = []; save(ROUTE_KEY, []); renderRoute(); if (state.sel) renderDetail(byId[state.sel]); } }, "비우기")),
    el("ol", null, ...pts.map((r, i) => el("li", null, (i + 1) + ". " + r.name, el("button", { "aria-label": r.name + " 빼기", onclick: () => toggleRoute(r.id) }, "×")))),
    el("div", { class: "rb" },
      pts.length > 1 ? el("button", { class: "btn", onclick: orderNearest }, "가까운 순서로") : null,
      el("a", { class: "btn primary", href: RL.kakao, target: "_blank", rel: "noopener", style: "text-decoration:none" }, "카카오맵으로 안내"),
      isPhone ? el("a", { class: "btn", href: RL.naver, style: "text-decoration:none" }, "네이버로 안내") : null));
}

/* ---------- 내 위치 ---------- */
let watchId = null, wantCenter = false, lastDrawn = null;
function locate(center) {
  if (!navigator.geolocation) { toast("이 브라우저에서는 위치를 쓸 수 없습니다"); return; }
  if (state.me && center) map.flyTo([state.me.lat, state.me.lng], Math.max(map.getZoom(), 15), { duration: .5 });
  if (watchId != null) return;
  wantCenter = center; $("#bMe").classList.add("on");
  watchId = navigator.geolocation.watchPosition(pos => {
    const first = !state.me;
    state.me = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
    const ll = [state.me.lat, state.me.lng];
    if (!meMarker) { meCircle = L.circle(ll, { radius: state.me.acc, color: "#4285f4", weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
      meMarker = L.marker(ll, { icon: L.divIcon({ className: "me", html: "<div></div>", iconSize: [18, 18] }), interactive: false, keyboard: false, zIndexOffset: 2000 }).addTo(map); }
    else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(state.me.acc); }
    if (first && wantCenter) map.flyTo(ll, Math.max(map.getZoom(), 15), { duration: .5 });
    if (first || !lastDrawn || dist(lastDrawn) > 40) { lastDrawn = { lat: state.me.lat, lng: state.me.lng }; renderList(); renderRoute(); if (state.sel) renderDetail(byId[state.sel]); }
  }, err => {
    navigator.geolocation.clearWatch(watchId); watchId = null; $("#bMe").classList.remove("on");
    toast(err.code === 1 ? "위치 권한이 꺼져 있습니다 (브라우저 설정에서 허용)" : "현재 위치를 찾지 못했습니다");
    if (state.sort === "near" && !state.me) setSort("no");
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
function setSort(s) {
  state.sort = s; document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.sort === s));
  if (s === "near" && !state.me) { locate(false); toast("현재 위치를 찾는 중…"); }
  renderList();
}

/* ---------- 이벤트 ---------- */
const q = $("#q");
q.addEventListener("input", () => { state.q = q.value; $("#qclear").hidden = !q.value; if (!$("#detail").hidden) closeDetail(); refresh(); });
q.addEventListener("focus", () => { if (mq.matches) setSheet("full"); });
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { q.blur(); if (lastVis.length === 1) select(lastVis[0].id); else if (mq.matches) setSheet("half"); fitVisible(); }
  if (e.key === "Escape") { q.value = ""; q.dispatchEvent(new Event("input")); }
});
$("#qclear").onclick = () => { q.value = ""; q.dispatchEvent(new Event("input")); q.focus(); };
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setSort(b.dataset.sort));
$("#bMe").onclick = () => locate(true);
$("#bAll").onclick = () => fitVisible(true);
$("#bLbl").onclick = () => { state.labels = !state.labels; $("#bLbl").classList.toggle("on", state.labels); updateLabels(); };
$("#bSat").onclick = () => {
  state.sat = !state.sat; $("#bSat").classList.toggle("on", state.sat); $("#bSat").textContent = state.sat ? "지도" : "위성";
  $("#bSat").title = state.sat ? "일반 지도" : "위성 사진"; $("#map").classList.toggle("sat", state.sat);
  if (state.sat) { map.removeLayer(osm); sat.addTo(map); } else { map.removeLayer(sat); osm.addTo(map); }
};
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && !$("#detail").hidden && document.activeElement !== q) closeDetail();
});
function fitVisible(all) {
  const rs = all ? DATA : (lastVis.length ? lastVis : DATA);
  const b = L.latLngBounds(rs.map(r => [r.lat, r.lng]));
  const s = mq.matches ? (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheet")) || 0) : 0;
  map.fitBounds(b, { paddingTopLeft: [30, 30], paddingBottomRight: [30, 30 + s], maxZoom: 16 });
}

/* ---------- 시작 ---------- */
$("#ttl").textContent = META.folder;
$("#srcLink").href = META.source;
document.title = META.folder + " — 시설물 지도";
renderChips(); refresh(); renderRoute(); setSheet("peek");
fitVisible(true); updateLabels();
const m0 = location.hash.match(/^#f=(\d+)$/);
if (m0 && byId[m0[1]]) setTimeout(() => select(m0[1]), 300);
</script>
